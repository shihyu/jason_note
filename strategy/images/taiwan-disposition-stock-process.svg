<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">一般交易、注意交易與處置交易流程</title>
  <desc id="desc">股票由一般交易經注意資訊公告，符合處置作業要點條件時可能進入處置。處置措施應以個股官方公告為準。</desc>
  <rect width="1120" height="390" rx="24" fill="#f6f4ef"/>
  <g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#172725">
    <text x="48" y="65" font-size="30" font-weight="700">注意股與處置股：先看公告，再看措施</text>
    <text x="48" y="99" font-size="17" fill="#52625e">注意資訊累積符合特定條件後，才可能發布處置；兩者交易資格不同。</text>

    <rect x="48" y="145" width="285" height="155" rx="17" fill="#ffffff" stroke="#c9d9d2" stroke-width="2"/>
    <rect x="48" y="145" width="285" height="54" rx="17" fill="#dbe9e2"/>
    <rect x="48" y="181" width="285" height="18" fill="#dbe9e2"/>
    <text x="72" y="181" font-size="22" font-weight="700">一般交易</text>
    <text x="72" y="233" font-size="18">依一般市場規則撮合</text>
    <text x="72" y="267" font-size="16" fill="#52625e">當沖資格須逐檔確認</text>

    <path d="M345 223 H389" stroke="#688a7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M379 214 L394 223 L379 232" fill="none" stroke="#688a7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="405" y="145" width="285" height="155" rx="17" fill="#ffffff" stroke="#d9c8a6" stroke-width="2"/>
    <rect x="405" y="145" width="285" height="54" rx="17" fill="#f2e6cd"/>
    <rect x="405" y="181" width="285" height="18" fill="#f2e6cd"/>
    <text x="429" y="181" font-size="22" font-weight="700">公布注意資訊</text>
    <text x="429" y="233" font-size="18">依異常標準公告</text>
    <text x="429" y="267" font-size="16" fill="#52625e">不等於已進入處置</text>

    <path d="M702 223 H746" stroke="#688a7e" stroke-width="4" stroke-linecap="round"/>
    <path d="M736 214 L751 223 L736 232" fill="none" stroke="#688a7e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="762" y="145" width="310" height="155" rx="17" fill="#ffffff" stroke="#e1b8aa" stroke-width="2"/>
    <rect x="762" y="145" width="310" height="54" rx="17" fill="#f0dcd6"/>
    <rect x="762" y="181" width="310" height="18" fill="#f0dcd6"/>
    <text x="786" y="181" font-size="22" font-weight="700">公布處置</text>
    <text x="786" y="233" font-size="18">一般上市處置約每 2 分鐘撮合</text>
    <text x="786" y="267" font-size="16" fill="#52625e">預收條件與期限依個股公告</text>

    <text x="48" y="348" font-size="16" fill="#52625e">處置有價證券不得列入現股當沖標的；變更交易方法等類別有不同撮合頻率。</text>
  </g>
</svg>
