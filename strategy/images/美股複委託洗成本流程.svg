<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">全部賣出與部分賣出的成本差異</title>
  <desc id="desc">原成本五百萬元、市值一千萬元。全部賣出並買回後成本為一千萬元；賣出一半並買回後成本為七百五十萬元。</desc>
  <rect width="960" height="500" fill="#f8fafc"/>
  <text x="480" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0f172a">賣出並買回後的持股成本</text>
  <rect x="330" y="80" width="300" height="76" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="111" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">原成本 500 萬元</text>
  <text x="480" y="140" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#0f172a">目前市值 1,000 萬元</text>
  <path d="M480 156 V200 M480 200 H235 V230 M480 200 H725 V230" fill="none" stroke="#475569" stroke-width="3"/>
  <polygon points="227,222 235,236 243,222" fill="#475569"/>
  <polygon points="717,222 725,236 733,222" fill="#475569"/>
  <rect x="70" y="236" width="330" height="190" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="235" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#166534">全部賣出並買回</text>
  <text x="235" y="319" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#14532d">實現獲利 500 萬元</text>
  <text x="235" y="354" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#14532d">買回金額 1,000 萬元</text>
  <text x="235" y="398" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#14532d">新成本 1,000 萬元</text>
  <rect x="560" y="236" width="330" height="190" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="725" y="278" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#92400e">賣出一半並買回</text>
  <text x="725" y="319" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#78350f">實現獲利 250 萬元</text>
  <text x="725" y="354" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#78350f">買回金額 500 萬元</text>
  <text x="725" y="398" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#78350f">新成本 750 萬元</text>
  <text x="480" y="468" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#475569">未計價格波動、交易費用與匯率影響</text>
</svg>
