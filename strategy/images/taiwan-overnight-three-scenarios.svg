<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">次日盤中三種情境</title>
  <desc id="desc">以假設收盤價 100 元與買進均價 98.90 元為參考，分別觀察開高回落、開低跌破及回測後承接三種可能走勢。</desc>
  <rect width="1120" height="580" rx="24" fill="#f6f4ef"/>
  <g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#172725">
    <text x="48" y="64" font-size="30" font-weight="700">次日盤中：三種可能情境</text>
    <text x="48" y="98" font-size="17" fill="#52625e">假設昨日收盤 100.0 元、觀察分點買進均價 98.90 元；價格方向需由盤中資訊確認</text>

    <rect x="48" y="244" width="205" height="92" rx="18" fill="#223e39"/>
    <text x="75" y="281" font-size="19" font-weight="700" fill="#ffffff">盤前參考</text>
    <text x="75" y="310" font-size="17" fill="#d5e9e2">收盤 100.0 元</text>
    <path d="M253 290 H312" stroke="#778f84" stroke-width="3"/>
    <path d="M312 184 V450" stroke="#778f84" stroke-width="3"/>
    <path d="M312 184 H350 M312 290 H350 M312 450 H350" stroke="#778f84" stroke-width="3"/>

    <rect x="352" y="128" width="720" height="112" rx="18" fill="#ffffff" stroke="#e4b9a7" stroke-width="2"/>
    <rect x="352" y="128" width="11" height="112" rx="5" fill="#b45d42"/>
    <text x="385" y="164" font-size="21" font-weight="700" fill="#923d26">A  開高後回落</text>
    <text x="385" y="196" font-size="17">觀察 VWAP、成交量與早盤低點，再決定是否依做空規則處理。</text>
    <text x="385" y="222" font-size="15" fill="#64716c">98.90 元是試算參考價，無保證支撐效果。</text>

    <rect x="352" y="251" width="720" height="112" rx="18" fill="#ffffff" stroke="#dbc79c" stroke-width="2"/>
    <rect x="352" y="251" width="11" height="112" rx="5" fill="#ab8334"/>
    <text x="385" y="287" font-size="21" font-weight="700" fill="#846118">B  開低並跌破參考價</text>
    <text x="385" y="319" font-size="17">檢查實際成交與反彈結構，避免只憑試算均價推論跌勢。</text>
    <text x="385" y="345" font-size="15" fill="#64716c">分點資料無法證明每個帳戶的持倉與停損行為。</text>

    <rect x="352" y="374" width="720" height="112" rx="18" fill="#ffffff" stroke="#a8c9bd" stroke-width="2"/>
    <rect x="352" y="374" width="11" height="112" rx="5" fill="#3b8067"/>
    <text x="385" y="410" font-size="21" font-weight="700" fill="#27634d">C  回測後出現承接</text>
    <text x="385" y="442" font-size="17">若重新站上 VWAP 並突破早盤高點，再評估做多訊號。</text>
    <text x="385" y="468" font-size="15" fill="#64716c">若已有空單，仍須依預定停損規則處理。</text>

    <text x="48" y="545" font-size="16" fill="#52625e">情境圖為教學示意，非價格預測；所有數值均為虛構範例。</text>
  </g>
</svg>
