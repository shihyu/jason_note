<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">隔日沖分點資料與計算指標</title>
  <desc id="desc">由分點買進、賣出與成交量資料，計算觀察分點淨買超佔比及加權平均買進價。圖中數值為虛構範例。</desc>
  <rect width="1120" height="500" rx="24" fill="#f6f4ef"/>
  <g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif" fill="#172725">
    <text x="48" y="65" font-size="30" font-weight="700">分點資料如何變成觀察指標</text>
    <text x="48" y="98" font-size="17" fill="#52625e">假設總成交 10,000 張，觀察分點 A、B、C 合計淨買超 3,500 張</text>

    <rect x="48" y="142" width="302" height="226" rx="18" fill="#ffffff" stroke="#d6ded9" stroke-width="2"/>
    <rect x="48" y="142" width="302" height="55" rx="18" fill="#dbe9e2"/>
    <rect x="48" y="178" width="302" height="19" fill="#dbe9e2"/>
    <text x="72" y="178" font-size="21" font-weight="700">01  收集分點資料</text>
    <text x="72" y="229" font-size="18">買進張數：3,500 張</text>
    <text x="72" y="266" font-size="18">賣出張數：0 張</text>
    <text x="72" y="303" font-size="18">買進金額：3.4616 億元</text>
    <text x="72" y="340" font-size="16" fill="#52625e">先確認單位與資料日期</text>

    <path d="M361 252 H394" stroke="#507c70" stroke-width="4" stroke-linecap="round"/>
    <path d="M393 244 L407 252 L393 260" fill="none" stroke="#507c70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="420" y="142" width="302" height="226" rx="18" fill="#ffffff" stroke="#d6ded9" stroke-width="2"/>
    <rect x="420" y="142" width="302" height="55" rx="18" fill="#dce7ef"/>
    <rect x="420" y="178" width="302" height="19" fill="#dce7ef"/>
    <text x="444" y="178" font-size="21" font-weight="700">02  計算淨買超佔比</text>
    <text x="444" y="231" font-size="18">3,500 ÷ 10,000 × 100%</text>
    <text x="444" y="288" font-size="43" font-weight="700" fill="#225d86">35%</text>
    <text x="444" y="340" font-size="16" fill="#52625e">策略觀察值，非官方門檻</text>

    <path d="M733 252 H766" stroke="#507c70" stroke-width="4" stroke-linecap="round"/>
    <path d="M765 244 L779 252 L765 260" fill="none" stroke="#507c70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="792" y="142" width="280" height="226" rx="18" fill="#ffffff" stroke="#d6ded9" stroke-width="2"/>
    <rect x="792" y="142" width="280" height="55" rx="18" fill="#f3e6cc"/>
    <rect x="792" y="178" width="280" height="19" fill="#f3e6cc"/>
    <text x="816" y="178" font-size="21" font-weight="700">03  計算買進均價</text>
    <text x="816" y="231" font-size="17">3.4616 億 ÷ 350 萬股</text>
    <text x="816" y="288" font-size="43" font-weight="700" fill="#9a5b17">98.90 元</text>
    <text x="816" y="340" font-size="16" fill="#52625e">僅為買進均價估計</text>

    <rect x="48" y="403" width="1024" height="57" rx="12" fill="#e7ece8"/>
    <text x="72" y="438" font-size="17" fill="#40544c">注意：分點可能包含多位客戶；買進均價不等於剩餘持倉成本，也無法保證次日價格方向。</text>
  </g>
</svg>
